name: uz-voice
on:
  push:
    branches: [main]
    paths: ["bebold/voice/uz_jobs/**", "scripts/uz_tts.py", ".github/workflows/uz-voice.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-lines
  cancel-in-progress: false
jobs:
  uzbek:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          git clone -q https://github.com/gokhaneraslan/chatterbox-finetuning
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r chatterbox-finetuning/requirements.txt || true
          pip install -q peft safetensors faster-whisper huggingface_hub
          cd chatterbox-finetuning && python setup.py && cd ..
          python -c "from huggingface_hub import hf_hub_download as d; [d('UAzimov/Uzbek-tts-chatterbox', f, local_dir='uz_adapter') for f in ['adapter_model.safetensors','adapter_config.json']]"
          ls chatterbox-finetuning chatterbox-finetuning/pretrained_models | head -40
      - run: python scripts/uz_tts.py
      - if: always()
        run: |
          git config user.name "bebold-bot"; git config user.email "bebold-bot@users.noreply.github.com"
          git add bebold/voice/uz_out || true; git commit -m "Uzbek voice lines" || exit 0
          git pull --rebase -X theirs -q origin main && git push -q
