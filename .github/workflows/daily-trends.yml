name: daily-trends
on:
  schedule:
    - cron: "17 10 * * *"   # ~4:17 AM Central daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/daily_trends.sh", ".github/workflows/daily-trends.yml"]
permissions:
  contents: write
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/daily_trends.sh
      - name: Commit results
        run: |
          git config user.name "bebold-bot"; git config user.email "bebold-bot@users.noreply.github.com"
          git add bebold/trends
          git commit -m "Daily trends $(date -u +%F)" || exit 0
          git pull --rebase -q origin main && git push -q
