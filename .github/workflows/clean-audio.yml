name: clean-audio
on:
  push:
    branches: [main]
    paths: ["bebold/voice/clean/in/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-lines
  cancel-in-progress: false
jobs:
  deepfilter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q torch==2.0.1 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu   # DeepFilterNet needs torchaudio<2.1
          pip install -q deepfilternet "numpy<2"
      - run: |
          mkdir -p bebold/voice/clean/out
          for f in bebold/voice/clean/in/*.wav; do
            n=$(basename "$f"); [ -f "bebold/voice/clean/out/$n" ] && continue
            deepFilter "$f" -o bebold/voice/clean/out/ && mv "bebold/voice/clean/out/${n%.wav}_DeepFilterNet3.wav" "bebold/voice/clean/out/$n" 2>/dev/null || true
          done
          ls -la bebold/voice/clean/out
      - run: |
          git config user.name "bebold-bot"; git config user.email "bebold-bot@users.noreply.github.com"
          git add bebold/voice/clean; git commit -m "DeepFilterNet cleaned audio" || exit 0
          git pull --rebase -X theirs -q origin main && git push -q
